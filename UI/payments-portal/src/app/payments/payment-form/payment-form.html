<mat-card class="payment-card">

    <!-- Title -->
    <mat-card-title>
        {{ isEdit ? 'Edit Payment' : 'Create Payment' }}
    </mat-card-title>

    <mat-card-content>
        <form [formGroup]="form" class="payment-form">

            <!-- Amount -->
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Amount</mat-label>
                <input matInput type="number" formControlName="amount" />
                <mat-error *ngIf="form.controls['amount'].invalid">
                    Amount must be greater than 0
                </mat-error>
            </mat-form-field>

            <!-- Currency -->
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Currency</mat-label>
                <mat-select formControlName="currency">
                    <mat-option *ngFor="let c of currencies" [value]="c">
                        {{ c }}
                    </mat-option>
                </mat-select>
                <mat-error *ngIf="form.controls['currency'].invalid">
                    Currency is required
                </mat-error>
            </mat-form-field>

        </form>
    </mat-card-content>

    <!-- Actions at bottom -->
    <mat-card-actions align="end" class="actions">

        <button *ngIf="isEdit" mat-raised-button color="warn" type="button" (click)="deletePayment()">
            Delete
        </button>

        <button mat-raised-button color="primary" [disabled]="form.invalid" (click)="save()">
            {{ isEdit ? 'Update' : 'Save' }}
        </button>

        <button mat-button type="button" (click)="onCancel()">
            Cancel
        </button>
        
    </mat-card-actions>

</mat-card>
