<div class="list-header">
  <h2>Payments</h2>

  <a mat-raised-button color="accent" routerLink="/add" class="add-button">
    + Add Payment
  </a>
</div>

<mat-form-field appearance="outline" class="search">
  <mat-label>Search</mat-label>
  <input matInput (keyup)="applyFilter($event)" placeholder="Reference, currency, amount">
</mat-form-field>

<div class="table-container">
  <table mat-table
         [dataSource]="dataSource"
         matSort
         class="mat-elevation-z8 full-width">

    <!-- Reference -->
    <ng-container matColumnDef="reference">
      <th mat-header-cell *matHeaderCellDef mat-sort-header sticky>
        Reference
      </th>
      <td mat-cell *matCellDef="let p">
        {{ p.reference }}
      </td>
    </ng-container>

    <ng-container matColumnDef="amount">
      <th mat-header-cell *matHeaderCellDef mat-sort-header sticky>
        Amount
      </th>
      <td mat-cell *matCellDef="let p">
        {{ p.amount | number:'1.2-2' }}
      </td>
    </ng-container>

    <ng-container matColumnDef="currency">
      <th mat-header-cell *matHeaderCellDef mat-sort-header sticky>
        Currency
      </th>
      <td mat-cell *matCellDef="let p">
        {{ p.currency }}
      </td>
    </ng-container>

    <!-- Created At -->
    <ng-container matColumnDef="createdAt">
      <th mat-header-cell *matHeaderCellDef mat-sort-header sticky>
        Created At
      </th>
      <td mat-cell *matCellDef="let p">
        {{ p.createdAt | date:'medium' }}
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef sticky>
        Actions
      </th>
      <td mat-cell *matCellDef="let p">
        <button mat-button color="primary"
                [routerLink]="['/edit', p.id]">
          Edit
        </button>

        <button mat-button color="warn"
                (click)="delete(p.id)">
          Delete
        </button>
      </td>
    </ng-container>

    <!-- Rows -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

  </table>
</div>

<mat-paginator
  [pageSizeOptions]="[5, 10, 25]"
  [pageSize]="10"
  showFirstLastButtons>
</mat-paginator>
